services:
  postgres:
    image: postgres:16-alpine
    container_name: turbofan-postgres
    environment:
      POSTGRES_DB: turbofan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d turbofan"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - turbofan-net

  mqtt-broker:
    build:
      context: ./mqtt-broker
      dockerfile: Dockerfile
    container_name: turbofan-mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: unless-stopped
    networks:
      - turbofan-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: turbofan-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped
    networks:
      - turbofan-net

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: turbofan-kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped
    networks:
      - turbofan-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: turbofan-kafka-ui
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped
    networks:
      - turbofan-net

  redis:
    image: redis:7-alpine
    container_name: turbofan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - turbofan-net

  backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: turbofan-backend-api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/turbofan
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - turbofan-net

  dashboard:
    build:
      context: .
      dockerfile: dasboard/Dockerfile
    container_name: turbofan-dashboard
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      REACT_APP_API_URL: http://localhost:8000
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend-api:
        condition: service_started
    restart: unless-stopped
    networks:
      - turbofan-net

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: turbofan-simulator
    env_file:
      - ./simulator/simulator.env
    depends_on:
      mqtt-broker:
        condition: service_started
    restart: unless-stopped
    networks:
      - turbofan-net

  ingest-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: turbofan-ingest-service
    working_dir: /app/backend
    environment:
      INGESTION_MODE: mqtt
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: 1883
      MQTT_TOPIC: turbofan/telemetry
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: turbofan.raw.telemetry
      LOG_LEVEL: INFO
      SERVICE_NAME: ingest-service
    command: >
      sh -c "python -m services.ingestion.service"
    depends_on:
      mqtt-broker:
        condition: service_started
      kafka:
        condition: service_started
    restart: unless-stopped
    networks:
      - turbofan-net

  dataset-replay-service:
    image: python:3.11-slim
    container_name: turbofan-dataset-replay-service
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    environment:
      INGESTION_MODE: dataset
      DATASET_PATH: /workspace/data/processed/test
      REPLAY_SPEED: 10x
      REPLAY_LIMIT: ""
      REPLAY_START_INDEX: 0
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: 1883
      MQTT_TOPIC: turbofan/telemetry
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: turbofan.raw.telemetry
      LOG_LEVEL: INFO
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python services/kafka_consumer.py"
    depends_on:
      kafka:
        condition: service_started
    restart: "no"
    networks:
      - turbofan-net

  stream-processor:
    image: python:3.11-slim
    container_name: turbofan-stream-processor
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: turbofan.raw.telemetry
      KAFKA_OUTPUT_TOPIC: turbofan.features
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: >
      sh -c "echo 'stream processor placeholder running';
      while true; do sleep 3600; done"
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - turbofan-net

  feature-service:
    image: python:3.11-slim
    container_name: turbofan-feature-service
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: turbofan.features
      KAFKA_OUTPUT_TOPIC: turbofan.model.input
    command: >
      sh -c "echo 'feature service placeholder running';
      while true; do sleep 3600; done"
    depends_on:
      kafka:
        condition: service_started
    restart: unless-stopped
    networks:
      - turbofan-net

  model-serving:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: turbofan-model-serving
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAW_TELEMETRY_TOPIC: turbofan.raw.telemetry
      PREDICTION_RESULTS_TOPIC: turbofan.prediction.results
      MODEL_TYPE: isolation_forest
    command: >
      sh -c "python -m backend.services.inference_service"
    depends_on:
      kafka:
        condition: service_started
    restart: unless-stopped
    networks:
      - turbofan-net

  prediction-writer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: turbofan-prediction-writer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PREDICTION_RESULTS_TOPIC: turbofan.prediction.results
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/turbofan
      ALERT_THRESHOLD: 0.85
    command: >
      sh -c "python -m backend.services.prediction_writer_service"
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - turbofan-net

  alert-service:
    image: python:3.11-slim
    container_name: turbofan-alert-service
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: turbofan.anomalies
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ALERT_CHANNELS: email,slack,sms
    command: >
      sh -c "echo 'alert service placeholder running';
      while true; do sleep 3600; done"
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - turbofan-net

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: turbofan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - turbofan-net

  etl-batch-job:
    image: python:3.11-slim
    container_name: turbofan-etl-batch-job
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./data:/data
    environment:
      RAW_DATA_PATH: /data
      FEATURE_STORE_URI: s3://turbofan-feature-store
      MINIO_ENDPOINT: http://minio:9000
    command: >
      sh -c "echo 'etl batch job placeholder running';
      while true; do sleep 3600; done"
    depends_on:
      minio:
        condition: service_started
    restart: unless-stopped
    networks:
      - turbofan-net

  trainer:
    image: python:3.11-slim
    container_name: turbofan-trainer
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./models:/models
      - ./data:/data
    environment:
      TRAIN_DATA_PATH: /data/processed/train
      MODEL_OUTPUT_PATH: /models
      MODEL_REGISTRY_URI: http://model-registry:5050
    command: >
      sh -c "echo 'offline trainer placeholder running';
      while true; do sleep 3600; done"
    depends_on:
      model-registry:
        condition: service_started
    restart: unless-stopped
    networks:
      - turbofan-net

  model-registry:
    image: python:3.11-slim
    container_name: turbofan-model-registry
    working_dir: /app
    environment:
      REGISTRY_PORT: 5050
    ports:
      - "5050:5050"
    command: >
      sh -c "echo 'model registry placeholder running';
      while true; do sleep 3600; done"
    restart: unless-stopped
    networks:
      - turbofan-net

  prometheus:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: turbofan-prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - turbofan-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: turbofan-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    networks:
      - turbofan-net

networks:
  turbofan-net:
    name: turbofan-net
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  grafana-data:
