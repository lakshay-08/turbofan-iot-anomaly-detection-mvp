services:
  postgres:
    image: postgres:16.4-alpine
    container_name: turbofan-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turbofan}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-turbofan}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - turbofan-net

  db-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: turbofan-backend:${APP_TAG:-local}
    container_name: turbofan-db-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@postgres:5432/turbofan}
    command: ["sh", "-c", "alembic upgrade head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - turbofan-net

  backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: turbofan-backend:${APP_TAG:-local}
    container_name: turbofan-backend-api
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@postgres:5432/turbofan}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-dev}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@turbofan.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123!}
      BOOTSTRAP_ADMIN_ROLE: ${BOOTSTRAP_ADMIN_ROLE:-admin}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - turbofan-net

  dashboard:
    build:
      context: .
      dockerfile: dasboard/Dockerfile
    image: turbofan-dashboard:${APP_TAG:-local}
    container_name: turbofan-dashboard
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
      PORT: ${DASHBOARD_PORT:-3000}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - turbofan-net

  mqtt-broker:
    image: eclipse-mosquitto:2.0.18
    container_name: turbofan-mqtt-broker
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t turbofan/healthcheck -m ok >/dev/null 2>&1 && mosquitto_sub -h localhost -t turbofan/healthcheck -C 1 -W 5 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - turbofan-net

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    image: turbofan-simulator:${APP_TAG:-local}
    container_name: turbofan-simulator
    environment:
      MQTT_HOST: ${MQTT_BROKER:-mqtt-broker}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-turbofan/telemetry}
      SIM_ENGINES: ${SIM_ENGINES:-4}
      SIM_INTERVAL: ${SIM_INTERVAL:-0.5}
      SIM_BATCH_MODE: ${SIM_BATCH_MODE:-false}
      SIM_DEBUG: ${SIM_DEBUG:-false}
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - turbofan-net

  test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: turbofan-backend:${APP_TAG:-local}
    container_name: turbofan-test
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@postgres:5432/turbofan}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-dev}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@turbofan.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123!}
      BOOTSTRAP_ADMIN_ROLE: ${BOOTSTRAP_ADMIN_ROLE:-admin}
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    profiles: ["test"]
    command: ["sh", "-c", "pytest -q"]
    restart: "no"
    networks:
      - turbofan-net

networks:
  turbofan-net:
    name: turbofan-net
    driver: bridge

volumes:
  postgres-data:
